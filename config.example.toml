# Copy to ~/.reeve/config.toml. Keys belong in `reeve key set <connection>`
# (stored at ~/.reeve/keys/<connection>, mode 0600), not here.

default_connection = "openrouter"
# model = "anthropic/claude-sonnet-5"   # overrides the connection's default_model
reasoning = "medium"                    # low | medium | high | default (send nothing)

[connections.openrouter]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
default_model = "anthropic/claude-sonnet-5"

[connections.openai]
kind = "openai"                         # any OpenAI-compatible endpoint
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
default_model = "gpt-5-mini"

# A model server on this machine: no key, priced at $0.
# [connections.ollama]
# kind = "local"
# base_url = "http://localhost:11434/v1"
# default_model = "qwen3:32b"

# Prices come live from each connection's /models list (OpenRouter includes
# cache read/write prices). A cost the provider reports always wins.
# Override a model here, USD per million tokens:
# [pricing."my/model"]
# input_per_million = 1.0
# output_per_million = 4.0
# cache_read_per_million = 0.1
# cache_write_per_million = 1.25

[spend]                                 # 0 = off. Caps stop work; they don't warn.
session_usd = 0
daily_usd = 0                           # all of Reeve, TUI and daemon
monthly_usd = 0
warn_usd = 1.00

[approvals]
yolo = false                            # ^y toggles per session; the safeguard floor always asks
undoable = false                        # changes Reeve can undo (file writes, edits, moves) run without asking

[snapshots]
enabled = true                          # snapper pre/post around root actions, when snapper covers /

[memory]
survey = true                           # read-only survey on first run, weekly after
auto_reflect = true                     # one model call per finished session to propose memories

[observer]                              # reeved: `reeve daemon install`
notify = true                           # popups when a proposed fix is ready (drafter, blocked orders)
notify_findings = false                 # also pop up for findings themselves (they're in /findings either way)
notify_every_minutes = 5                # with notify_findings: at most one popup this often
disk_warn = 0.90
temp_warn = 90.0

[observer.drafter]                      # pre-drafts fixes; off by default, own budget
enabled = false
# connection = "openrouter"             # default: the main connection
# model = "…"                           # default: the main model; a cheap one is plenty
daily_usd = 0.25
per_draft_usd = 0.05
max_drafts_per_day = 10
min_severity = "warning"

[privacy]                               # masked before anything leaves; restored locally
level = "standard"                      # chat: off | standard | strict
background = "strict"                   # the drafter and standing orders
no_training = true                      # OpenRouter: only providers that don't store or train on prompts
zdr = false                             # OpenRouter: only zero-data-retention endpoints
terms = []                              # more words to mask, e.g. ["Acme", "project-x"]

[ui]
theme = "slate"                         # slate (the board) | ink (warm charcoal) | brass (the original)
colors = "auto"                         # auto | truecolor | 256 | 16 ; NO_COLOR wins
mouse = true
animate = true

[updates]                               # reeved asks GitHub for the newest release every 12 h
check = true                            # false: never ask (`reeve update --check` still does)
