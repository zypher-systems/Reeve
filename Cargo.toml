[workspace]
resolver = "2"
members = ["crates/reeve-core", "crates/reeve-observer", "crates/reeve-tui", "crates/reeve-cli"]
default-members = ["crates/reeve-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Zypher Systems"]
repository = "https://github.com/zypher-systems/reeve"
homepage = "https://github.com/zypher-systems/reeve"

[workspace.dependencies]
reeve-core = { path = "crates/reeve-core" }
reeve-observer = { path = "crates/reeve-observer" }
reeve-tui = { path = "crates/reeve-tui" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time", "sync", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
regex = "1"
walkdir = "2"
similar = { version = "2", default-features = false, features = ["text"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
