[package]
name = "reeve-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reeve: an operator agent for your computer"

[[bin]]
name = "reeve"
path = "src/main.rs"

[dependencies]
reeve-core.workspace = true
reeve-tui.workspace = true
reeve-observer.workspace = true
clap.workspace = true
tokio.workspace = true
chrono.workspace = true
crossterm.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# `cargo generate-rpm -p crates/reeve-cli --target <triple>` (the release
# workflow does this): the binary, the user unit, and the docs.
[package.metadata.generate-rpm]
name = "reeve"
summary = "An operator agent that manages this computer, with receipts"
license = "Apache-2.0"
url = "https://github.com/zypher-systems/reeve"
assets = [
    { source = "target/release/reeve", dest = "/usr/bin/reeve", mode = "755" },
    { source = "packaging/systemd/reeved.service", dest = "/usr/lib/systemd/user/reeved.service", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/reeve/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/reeve/README.md", mode = "644", doc = true },
    { source = "config.example.toml", dest = "/usr/share/doc/reeve/config.example.toml", mode = "644", doc = true },
    # Written by packaging/dist.sh (packaging/third_party.py): run it first.
    { source = "dist/third-party/*", dest = "/usr/share/doc/reeve/third-party/", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
bash = "*"
sudo = "*"
util-linux = "*"
systemd = "*"

[package.metadata.generate-rpm.recommends]
libnotify = "*"
snapper = "*"

# `cargo deb -p reeve-cli --no-build --no-strip --target <triple> -o dist/`
# (the release workflow does this, after packaging/dist.sh): the same files
# as the RPM, for Debian and Ubuntu. cargo-deb reads paths from this crate's
# directory, so the workspace's files are ../../ from here.
[package.metadata.deb]
name = "reeve"
maintainer = "Zypher Systems <zypher@zyphersystems.com>"
copyright = "2026, Zypher Systems"
license-file = ["../../LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "bash, sudo, util-linux, systemd"
recommends = "libnotify-bin, snapper"
extended-description = """Reeve is an operator harness: an agent that runs on your computer and
manages it. It installs and removes packages, fixes services, reads logs,
tidies disks, and edits configuration across the whole filesystem. Every
action is classified by risk and approved by you where it should be, and
each one leaves a hash-chained receipt. File, package, and service changes
can be undone. The reeved user service watches the machine, learns what
normal looks like, and tells you when something needs a look."""
assets = [
    ["target/release/reeve", "usr/bin/", "755"],
    ["../../packaging/systemd/reeved.service", "usr/lib/systemd/user/", "644"],
    ["../../README.md", "usr/share/doc/reeve/", "644"],
    ["../../config.example.toml", "usr/share/doc/reeve/", "644"],
    ["../../dist/third-party/*", "usr/share/doc/reeve/third-party/", "644"],
]
